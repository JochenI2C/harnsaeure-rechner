<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#53b4ea"/>
      <stop offset="0.55" stop-color="#3d99d8"/>
      <stop offset="1" stop-color="#3383c5"/>
    </linearGradient>
    <radialGradient id="glanz" cx="0.25" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Vollflächiger Hintergrund (Android schneidet die Form selbst zu) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glanz)"/>
  <!-- Tacho: Inhalt bleibt im sicheren Bereich (mittlere 70 %) -->
  <g transform="translate(256 300)">
    <path d="M -130 0 A 130 130 0 0 1 130 0" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="44" stroke-linecap="round"/>
    <path d="M -130 0 A 130 130 0 0 1 -65 -112.6" fill="none" stroke="#79b279" stroke-width="34" stroke-linecap="round"/>
    <path d="M 22.6 -128 A 130 130 0 0 1 130 0" fill="none" stroke="#ff2c2c" stroke-width="34" stroke-linecap="round"/>
    <path d="M -65 -112.6 A 130 130 0 0 1 22.6 -128" fill="none" stroke="#fcd200" stroke-width="34"/>
    <!-- Zeiger steht im grünen Bereich -->
    <g transform="rotate(-48)">
      <path d="M -11 16 L -4 -112 Q 0 -120 4 -112 L 11 16 Z" fill="#fff"/>
    </g>
    <circle r="24" fill="#fff"/>
    <circle r="9" fill="#3383c5"/>
  </g>
</svg>
